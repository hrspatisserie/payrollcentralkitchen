        {monthFilter === "ALL" ? (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(210px, 1fr))", gap: 14, marginBottom: 26 }}>
            <KpiCard icon={<Wallet size={18} />} label="ยอดค่าจ้างรวม 7 เดือน" value={`฿${fmt(totalIncomeAll)}`} sub="รวมรายรับทุกสาขา" accent={INK} />
            <KpiCard icon={<Flame size={18} />} label="ยอด OT รวม 7 เดือน" value={`฿${fmt(totalOtAll)}`} sub="โอทีล่วงเวลาทุกประเภท" accent={OVEN} />
            <KpiCard icon={<Flame size={18} />} label="เดือนที่ OT สูงสุด" value={maxOtMonth.label} sub={`฿${fmt(maxOtMonth.ot)}`} accent={OVEN} highlight />
            <KpiCard icon={<Wallet size={18} />} label="เดือนที่จ่ายค่าจ้างสูงสุด" value={maxIncomeMonth.label} sub={`฿${fmt(maxIncomeMonth.income)}`} accent={SAGE} highlight />
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(210px, 1fr))", gap: 14, marginBottom: 26 }}>
            <KpiCard icon={<Wallet size={18} />} label={`ค่าจ้างรวม เดือน ${selected.label}`} value={`฿${fmt(selected.income)}`} sub="รวมรายรับทุกสาขา" accent={INK} highlight />
            <KpiCard icon={<Flame size={18} />} label={`OT รวม เดือน ${selected.label}`} value={`฿${fmt(selected.ot)}`} sub={`${((selected.ot / selected.income) * 100).toFixed(1)}% ของค่าจ้างรวม`} accent={OVEN} highlight />
            <KpiCard icon={<Users size={18} />} label="พนักงานที่มีข้อมูล" value={`${selected.n} คน`} sub={`เดือน ${selected.label} 2569`} accent={SAGE} />
            <KpiCard icon={<Flame size={18} />} label="OT เฉลี่ยต่อคน" value={`฿${fmt(selected.ot / selected.n)}`} sub={`เดือน ${selected.label}`} accent={CLAY} />
          </div>
        )}

        <div style={{ background: "#fff", border: `1px solid ${CRUST}33`, borderRadius: 14, padding: "18px 16px 8px", marginBottom: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8, flexWrap: "wrap", gap: 6 }}>
            <h2 style={{ fontFamily: "'Fraunces',serif", fontSize: 17, fontWeight: 600, margin: 0 }}>ค่าจ้างรวม vs. โอที รายเดือน</h2>
            <div style={{ display: "flex", gap: 14, fontSize: 12 }}>
              <LegendDot color={CRUST} label="ค่าจ้างรวม (แท่ง)" />
              <LegendDot color={OVEN} label="โอที (เส้น)" />
            </div>
          </div>
          <ResponsiveContainer width="100%" height={300}>
            <ComposedChart data={MONTHLY} margin={{ top: 10, right: 10, left: -10, bottom: 0 }}>
              <CartesianGrid stroke={FLOUR} vertical={false} />
              <XAxis dataKey="label" tick={{ fontSize: 12, fill: INK }} axisLine={{ stroke: CRUST }} tickLine={false} />
              <YAxis yAxisId="left" tick={{ fontSize: 11, fill: INK }} axisLine={false} tickLine={false} tickFormatter={(v) => `${Math.round(v / 1000)}k`} />
              <YAxis yAxisId="right" orientation="right" tick={{ fontSize: 11, fill: OVEN }} axisLine={false} tickLine={false} tickFormatter={(v) => `${Math.round(v / 1000)}k`} />
              <Tooltip formatter={(v, name) => [`฿${fmt2(v)}`, name === "income" ? "ค่าจ้างรวม" : "โอที"]}
                labelFormatter={(l) => `เดือน ${l}`}
                contentStyle={{ fontFamily: "'IBM Plex Sans Thai',sans-serif", borderRadius: 8, border: `1px solid ${CRUST}55` }} />
              <Bar yAxisId="left" dataKey="income" fill={CRUST} radius={[5, 5, 0, 0]} barSize={34} name="income" />
              <Line yAxisId="right" dataKey="ot" stroke={OVEN} strokeWidth={3} dot={{ r: 4, fill: OVEN }} name="ot" />
            </ComposedChart>
          </ResponsiveContainer>
        </div>

        <div style={{ background: "#fff", border: `1px solid ${CRUST}33`, borderRadius: 14, padding: "18px 16px 8px", marginBottom: 26 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8, flexWrap: "wrap", gap: 6 }}>
            <h2 style={{ fontFamily: "'Fraunces',serif", fontSize: 17, fontWeight: 600, margin: 0, display: "flex", alignItems: "center", gap: 8 }}>
              <Globe2 size={17} color={CRUST} /> แนวโน้ม OT: ครัวกลาง vs. ต่างชาติ
            </h2>
            <div style={{ display: "flex", gap: 14, fontSize: 12 }}>
              <LegendDot color={CLAY} label="ครัวกลาง" />
              <LegendDot color={SAGE} label="ต่างชาติ" />
            </div>
          </div>
          <ResponsiveContainer width="100%" height={280}>
            <LineChart data={BRANCH_TREND} margin={{ top: 10, right: 10, left: -10, bottom: 0 }}>
              <CartesianGrid stroke={FLOUR} vertical={false} />
              <XAxis dataKey="label" tick={{ fontSize: 12, fill: INK }} axisLine={{ stroke: CRUST }} tickLine={false} />
              <YAxis tick={{ fontSize: 11, fill: INK }} axisLine={false} tickLine={false} tickFormatter={(v) => `${Math.round(v / 1000)}k`} />
              <Tooltip formatter={(v) => [`฿${fmt2(v)}`, ""]} labelFormatter={(l) => `เดือน ${l}`}
                contentStyle={{ fontFamily: "'IBM Plex Sans Thai',sans-serif", borderRadius: 8, border: `1px solid ${CRUST}55` }} />
              <Line dataKey="ครัวกลาง" stroke={CLAY} strokeWidth={3} dot={{ r: 4, fill: CLAY }} />
              <Line dataKey="ต่างชาติ" stroke={SAGE} strokeWidth={3} dot={{ r: 4, fill: SAGE }} />
            </LineChart>
          </ResponsiveContainer>
        </div>

        <div style={{ background: "#fff", border: `1px solid ${CRUST}33`, borderRadius: 14, padding: "18px 16px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 12 }}>
            <h2 style={{ fontFamily: "'Fraunces',serif", fontSize: 17, fontWeight: 600, margin: 0, display: "flex", alignItems: "center", gap: 8 }}>
              <Flame size={18} color={OVEN} />
              รายชื่อ &amp; ยอด OT {monthFilter === "ALL" ? "แยกรายเดือน (ม.ค.–ก.ค. 2569)" : `เดือน ${monthChipLabel(monthFilter)} 2569`}
            </h2>
            <div style={{ display: "flex", gap: 8 }}>
              <div style={{ position: "relative" }}>
                <Search size={14} style={{ position: "absolute", left: 9, top: 9, color: CRUST }} />
                <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="ค้นหาชื่อ / รหัส"
                  style={{ padding: "7px 10px 7px 28px", borderRadius: 8, border: `1px solid ${CRUST}55`, fontSize: 13, fontFamily: "inherit", width: 180, outline: "none" }} />
              </div>
              <button onClick={() => setSortDesc((s) => !s)}
                style={{ display: "flex", alignItems: "center", gap: 6, padding: "7px 12px", borderRadius: 8, border: `1px solid ${CRUST}55`, background: FLOUR, fontSize: 13, cursor: "pointer", fontFamily: "inherit", color: INK }}>
                <ArrowUpDown size={13} /> {sortDesc ? "มาก→น้อย" : "น้อย→มาก"}
              </button>
            </div>
          </div>

          <div style={{ maxHeight: 520, overflowY: "auto", overflowX: "auto", borderRadius: 8 }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, minWidth: monthFilter === "ALL" ? 900 : 480 }}>
              <thead>
                <tr style={{ position: "sticky", top: 0, background: INK, color: PAPER, zIndex: 1 }}>
                  <th style={th}>#</th>
                  <th style={{ ...th, textAlign: "left" }}>รหัส</th>
                  <th style={{ ...th, textAlign: "left" }}>ชื่อ-นามสกุล</th>
                  <th style={{ ...th, textAlign: "left" }}>สาขา</th>
                  {monthFilter === "ALL" ? (
                    <>
                      {MONTHLY.map((m) => <th key={m.key} style={{ ...th, textAlign: "right" }}>{m.label}</th>)}
                      <th style={{ ...th, textAlign: "right", background: OVEN }}>รวม OT</th>
                    </>
                  ) : (
                    <th style={{ ...th, textAlign: "right", background: OVEN }}>OT (บาท)</th>
                  )}
                </tr>
              </thead>
              <tbody>
                {tableRows.map((e, i) => (
                  <tr key={e.id} className="row" style={{ borderBottom: `1px solid ${FLOUR}` }}>
                    <td style={{ ...td, color: CRUST }}>{i + 1}</td>
                    <td style={{ ...td, color: CRUST }} className="num">{e.id}</td>
                    <td style={{ ...td, fontWeight: 500 }}>{e.name}</td>
                    <td style={{ ...td, color: CRUST, fontSize: 12 }}>{e.branch}</td>
                    {monthFilter === "ALL" ? (
                      <>
                        {MONTHS.map((mk) => (
                          <td key={mk} style={{ ...td, textAlign: "right", color: e.byMonth[mk] == null ? "#c9bfa8" : INK }} className="num">
                            {e.byMonth[mk] == null ? "—" : fmt2(e.byMonth[mk])}
                          </td>
                        ))}
                        <td style={{ ...td, textAlign: "right", fontWeight: 700, color: OVEN }} className="num">{fmt2(e.value)}</td>
                      </>
                    ) : (
                      <td style={{ ...td, textAlign: "right", fontWeight: 700, color: OVEN }} className="num">{fmt2(e.value)}</td>
                    )}
                  </tr>
                ))}
                {tableRows.length === 0 && (
                  <tr><td colSpan={20} style={{ ...td, textAlign: "center", color: CRUST, padding: 24 }}>ไม่พบข้อมูล</td></tr>
                )}
              </tbody>
            </table>
          </div>
          <p style={{ fontSize: 11.5, color: CRUST, marginTop: 10, marginBottom: 0 }}>
            * ยอด OT รวมคอลัมน์ "โอทีล่วงเวลา (x1.5)" และ "โอทีล่วงเวลาวันหยุด" ต่อคนต่อเดือน (ไม่รวมค่าจ้าง/เงินเดือน) · "—" หมายถึงไม่มีข้อมูลเดือนนั้น · ไม่รวมชีท Sheet8
          </p>
        </div>
      </div>
    </div>
  );
}

function KpiCard({ icon, label, value, sub, accent, highlight }) {
  return (
    <div style={{ background: highlight ? INK : "#fff", color: highlight ? PAPER : INK, border: `1px solid ${highlight ? INK : CRUST + "33"}`, borderRadius: 14, padding: "16px 16px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
        {icon}
        <span style={{ fontSize: 12, fontWeight: 500, color: highlight ? PAPER + "cc" : CRUST }}>{label}</span>
      </div>
      <div style={{ fontFamily: "'Fraunces',serif", fontSize: 24, fontWeight: 700 }} className="num">{value}</div>
      <div style={{ fontSize: 12, marginTop: 2, color: highlight ? PAPER + "aa" : CRUST }} className="num">{sub}</div>
    </div>
  );
}

function LegendDot({ color, label }) {
  return (
    <span style={{ display: "flex", alignItems: "center", gap: 5, color: INK }}>
      <span style={{ width: 10, height: 10, borderRadius: 3, background: color, display: "inline-block" }} />
      {label}
    </span>
  );
}

const th = { padding: "9px 10px", fontWeight: 600, fontSize: 12, textAlign: "center" };
const td = { padding: "8px 10px" };

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PayrollDashboard />);
</script>
</body>
</html>
